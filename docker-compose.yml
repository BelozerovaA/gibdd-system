name: gibdd

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Задайте MYSQL_ROOT_PASSWORD в файле .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gibdd_db}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE:-gibdd_db}
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в файле .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Задайте SERVICE_TOKEN в файле .env}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-120}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SEED_USERS_FILE: /run/seed/seed_users.json
      RUN_SEED: ${RUN_SEED:-1}
    volumes:
      - type: bind
        source: ./backend/seed_users.json
        target: /run/seed/seed_users.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8000:8000"

  camera-service:
    build: ./camera-service
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      GIBDD_URL: http://backend:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Задайте SERVICE_TOKEN в файле .env}
      CAMERA_INTERVAL_SECONDS: ${CAMERA_INTERVAL_SECONDS:-60}
      ENABLE_MANUAL_DETECTIONS: ${ENABLE_MANUAL_DETECTIONS:-true}
    ports:
      - "127.0.0.1:9000:9000"

  web:
    build:
      context: ./web-frontend
      args:
        REACT_APP_API_URL: /api
        REACT_APP_FOUND_PROMPT_DELAY_MS: ${FOUND_PROMPT_DELAY_MS:-60000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  db_data:
