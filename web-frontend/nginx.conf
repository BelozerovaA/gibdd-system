server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API: запросы сайта к /api уходят в сервис ГИБДД
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # WebSocket: оповещения в реальном времени. Нужны заголовки Upgrade и долгий таймаут.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Одностраничное приложение: любой неизвестный адрес (/dashboard, /map) отдаёт index.html,
    # дальше маршрутизацию делает React Router.
    location / {
        try_files $uri /index.html;
    }

    # Статика с хешем в имени файла кэшируется надолго
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
